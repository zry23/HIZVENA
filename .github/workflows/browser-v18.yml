name: HIZVENA V18 browser regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hizvena-http.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run real Chromium responsive and customer journey tests
        run: node tests/browser-v18.mjs
      - name: Upload browser screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hizvena-v18-browser-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
