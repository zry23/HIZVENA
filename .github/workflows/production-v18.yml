name: HIZVENA V18 production health
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * *'
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public Cloudflare URL, catalogue and SEO assets
        run: node tests/production-v18.mjs
