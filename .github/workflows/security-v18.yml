name: HIZVENA V18 security baseline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '55 2 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan public files and anonymous HTTP security headers
        run: node tests/security-v18.mjs
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hizvena-v18-security-baseline
          path: audit-artifacts/security-baseline.json
          retention-days: 14
          if-no-files-found: ignore
