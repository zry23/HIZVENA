name: HIZVENA V18 Lighthouse quality gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Serve immutable PR snapshot
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hizvena-v18-http.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8765/ > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Install Lighthouse CLI
        run: npm install --no-save --no-package-lock lighthouse@12.8.2
      - name: Measure mobile Lighthouse
        run: |
          mkdir -p audit-artifacts
          npx lighthouse http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=./audit-artifacts/lighthouse-mobile.json --quiet --max-wait-for-load=25000
      - name: Measure desktop Lighthouse
        run: |
          npx lighthouse http://127.0.0.1:8765/ --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=./audit-artifacts/lighthouse-desktop.json --quiet --max-wait-for-load=25000
      - name: Validate measured score thresholds and report Web Vitals
        run: node tests/lighthouse-score-v18.mjs
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hizvena-v18-lighthouse-reports
          path: audit-artifacts/lighthouse-*.json
          retention-days: 14
          if-no-files-found: ignore
